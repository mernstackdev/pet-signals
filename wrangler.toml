# Cloudflare Workers configuration — static assets.
#
# `dist/` is deployed as a static-assets Worker, so the default Workers Builds
# deploy command (`npx wrangler deploy`) works with no Worker script.
#
# IMPORTANT: `name` must match the Worker name in the Cloudflare dashboard,
# otherwise the build deploys to a different Worker than the one with the domain.
name = "pet-signals"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"
# "/about" → "/about/" so URLs match the canonical URLs Astro emits.
html_handling = "auto-trailing-slash"
# Serve dist/404.html for unknown paths.
not_found_handling = "404-page"
